name = "k4-ramsey"
version = "0.1.0"
defaultTargets = ["K4Ramsey"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "K4Ramsey"
# native_decide uses imported code: without this, the expensive counter runs
# in the interpreter. Keep computation in imported modules, not in the proof.
precompileModules = true

[[lean_lib]]
name = "Tests"
roots = ["Tests.Multiplicity", "Tests.WeightedMultiplicity", "Tests.TemplateInput"]
precompileModules = true

[[lean_exe]]
name = "check_published"
root = "Executables.CheckPublished"

[[lean_exe]]
name = "check_final3840"
root = "Executables.CheckFinal3840"

[[lean_exe]]
name = "check_candidate"
root = "Executables.CheckCandidate"

[[lean_exe]]
name = "check_weighted_candidate"
root = "Executables.WeightedCandidate"
moreLeanArgs = ["-j1"]
